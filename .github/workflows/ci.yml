name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Ruff
        run: |
          pip install ruff
          ruff check frappe_mcp_bridge mcp_server/src
          ruff format --check frappe_mcp_bridge mcp_server/src

  tests:
    name: Frappe ${{ matrix.frappe }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - frappe: version-15
            python: '3.11'
            node: 20
            mariadb: '10.6'
          - frappe: version-16
            python: '3.14'
            node: 24
            mariadb: '11.8'

    services:
      redis-cache:
        image: redis:alpine
        ports:
          - 13000:6379
      redis-queue:
        image: redis:alpine
        ports:
          - 11000:6379
      mariadb:
        image: mariadb:${{ matrix.mariadb }}
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: --health-cmd="mariadb-admin ping" --health-interval=5s --health-timeout=2s --health-retries=5

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-${{ matrix.frappe }}-pip-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.frappe }}-pip-

      - name: Install MariaDB client
        run: |
          sudo apt update
          sudo apt-get install -y mariadb-client

      - name: Set up bench
        run: |
          pip install frappe-bench
          bench init --skip-redis-config-generation --skip-assets \
            --frappe-branch ${{ matrix.frappe }} \
            --python "$(which python)" ~/frappe-bench

      - name: Install app
        working-directory: /home/runner/frappe-bench
        run: |
          bench get-app frappe_mcp_bridge $GITHUB_WORKSPACE
          bench setup requirements --dev
          bench new-site --db-root-password root --admin-password admin test_site
          bench --site test_site install-app frappe_mcp_bridge
        env:
          CI: 'Yes'

      - name: Run tests
        working-directory: /home/runner/frappe-bench
        run: |
          bench --site test_site set-config allow_tests true
          bench --site test_site run-tests --app frappe_mcp_bridge
