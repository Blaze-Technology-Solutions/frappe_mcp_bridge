[project]
name = "frappe-mcp-bridge"
version = "0.1.0"
description = "MCP server that exposes a Frappe site to Claude"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.0,<3",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.scripts]
frappe-mcp-bridge = "frappe_mcp_bridge_client.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/frappe_mcp_bridge_client"]

[tool.ruff]
line-length = 110

[tool.ruff.format]
quote-style = "double"
indent-style = "tab"
